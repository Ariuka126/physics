<script>
const UNITS=[{"id":1,"title":"Physical Quantities and Units","strand":"Mechanics","topics":[{"id":"vectors","name":"Scalars, vectors and uncertainty","formulas":[{"id":"resolve","name":"Resolving a vector","tex":"F_x = F\\cos\\theta,\\quad F_y = F\\sin\\theta","vars":[["F","magnitude of vector","N (any vector unit)"],["\\theta","angle between F and the x-axis","° or rad"],["F_x, F_y","perpendicular components","N"]],"conditions":"Perpendicular axes; θ measured from the x-axis.","steps":[{"text":"Draw the vector as the hypotenuse of a right-angled triangle whose other sides lie along the x and y axes."},{"text":"By definition of cosine in the triangle, adjacent over hypotenuse gives:","tex":"\\cos\\theta = \\frac{F_x}{F}"},{"text":"Rearrange. The same argument with the opposite side gives the y component:","tex":"F_x = F\\cos\\theta,\\qquad F_y = F\\sin\\theta"},{"text":"Check: Pythagoras recovers the magnitude, since sin²θ + cos²θ = 1.","tex":"F_x^2+F_y^2 = F^2(\\cos^2\\theta+\\sin^2\\theta)=F^2"}],"misconceptions":["Using cos for the component along a slope when the angle is measured from the vertical; always ask which side is adjacent to the angle given.","Adding vector magnitudes directly instead of adding components."],"tips":["Paper 2: state the axes you choose, then resolve; for an inclined plane the weight component along the slope is mg sinθ.","Check calculator mode is degrees."]},{"id":"uncert","name":"Combining percentage uncertainties","tex":"\\frac{\\Delta (xy)}{xy}=\\frac{\\Delta x}{x}+\\frac{\\Delta y}{y}","vars":[["\\Delta x","absolute uncertainty in x","unit of x"],["\\Delta x/x","fractional uncertainty","no unit"]],"conditions":"Quantities multiplied or divided; use the maximum-uncertainty method. Powers: multiply the fractional uncertainty by the power.","steps":[{"text":"Let the true values be x ± Δx and y ± Δy. The largest possible product uses the largest of each:","tex":"(x+\\Delta x)(y+\\Delta y)=xy+x\\Delta y+y\\Delta x+\\Delta x\\Delta y"},{"text":"Δx·Δy is a product of two small quantities and is negligible, so the uncertainty in the product is:","tex":"\\Delta(xy)\\approx x\\,\\Delta y + y\\,\\Delta x"},{"text":"Divide both sides by xy:","tex":"\\frac{\\Delta (xy)}{xy}=\\frac{\\Delta y}{y}+\\frac{\\Delta x}{x}"},{"text":"For a quotient x/y the worst case is the same: uncertainties still add. For x², put y = x, giving 2Δx/x."}],"misconceptions":["Subtracting uncertainties when dividing: they always add.","Adding percentage uncertainties when quantities are added or subtracted: in that case add the absolute uncertainties."],"tips":["Paper 3-style questions also appear on Paper 2: for a graph gradient, use the worst acceptable line.","Quote final uncertainties to 1 significant figure (2 if it starts with 1)."]}]}]},{"id":2,"title":"Kinematics","strand":"Mechanics","topics":[{"id":"suvat","name":"Equations of uniformly accelerated motion","formulas":[{"id":"vuat","name":"Velocity–time equation","tex":"v = u + at","vars":[["u","initial velocity","m s⁻¹"],["v","final velocity","m s⁻¹"],["a","acceleration","m s⁻²"],["t","time","s"]],"conditions":"Constant acceleration in a straight line.","steps":[{"text":"Acceleration is defined as the rate of change of velocity:","tex":"a=\\frac{\\Delta v}{\\Delta t}"},{"text":"Over time t, velocity changes from u to v, so Δv = v − u and Δt = t:","tex":"a=\\frac{v-u}{t}"},{"text":"Multiply by t and rearrange:","tex":"at = v-u\\;\\Rightarrow\\; v=u+at"},{"text":"Because a is constant, the v–t graph is a straight line of gradient a and y-intercept u."}],"misconceptions":["Applying it to a whole journey in which acceleration changes (e.g. a lift that speeds up, cruises, then stops): split into stages.","Mixing signs: choose a positive direction and keep to it."],"tips":["Write out s, u, v, a, t and mark the unknown before choosing an equation.","At the top of a projectile's vertical path v = 0 but a = −g."]},{"id":"sut","name":"Displacement–time equation","tex":"s = ut + \\tfrac12 at^2","vars":[["s","displacement","m"],["u","initial velocity","m s⁻¹"],["a","acceleration","m s⁻²"],["t","time","s"]],"conditions":"Constant acceleration in a straight line.","steps":[{"text":"Displacement is average velocity multiplied by time:","tex":"s=v_{av}\\,t"},{"text":"With constant acceleration, velocity changes linearly, so the average is the mean of the start and end values:","tex":"v_{av}=\\frac{u+v}{2}"},{"text":"Substitute v = u + at:","tex":"v_{av}=\\frac{u+(u+at)}{2}=u+\\tfrac12 at"},{"text":"Therefore:","tex":"s=\\left(u+\\tfrac12at\\right)t=ut+\\tfrac12at^2"},{"text":"Geometrically, s is the area under the v–t graph: a rectangle ut plus a triangle ½(at)t."}],"misconceptions":["Believing the ½ belongs to the ut term.","Using s for distance travelled when the object reverses direction: s is displacement."],"tips":["Dropping from rest: u = 0 so s = ½gt².","Quadratic in t: reject the negative root only if it makes physical sense."]},{"id":"vsq","name":"Velocity–displacement equation","tex":"v^2 = u^2 + 2as","vars":[["v,u","final and initial velocity","m s⁻¹"],["a","acceleration","m s⁻²"],["s","displacement","m"]],"conditions":"Constant acceleration in a straight line; time not needed.","steps":[{"text":"Start from v = u + at and from s = ½(u + v)t."},{"text":"Eliminate t using t = (v − u)/a in the second:","tex":"s=\\frac{(u+v)(v-u)}{2a}"},{"text":"Expand the difference of squares:","tex":"2as=v^2-u^2"},{"text":"Rearrange:","tex":"v^2=u^2+2as"}],"misconceptions":["Forgetting v² is positive even if v is negative; take ± square root and use context.","Using it when acceleration varies."],"tips":["Use whenever t is neither given nor wanted.","Stopping distance: v = 0 gives s = −u²/2a; doubling speed quadruples braking distance."]}]},{"id":"projectile","name":"Projectile motion","formulas":[{"id":"range","name":"Horizontal range (level ground)","tex":"R=\\frac{u^2\\sin 2\\theta}{g}","vars":[["R","horizontal range","m"],["u","launch speed","m s⁻¹"],["\\theta","launch angle above horizontal","°"],["g","free-fall acceleration","m s⁻²"]],"conditions":"No air resistance; launch and landing at same height; uniform g.","steps":[{"text":"Resolve the launch velocity: horizontal u cosθ (constant), vertical u sinθ (acceleration −g).","tex":"u_x=u\\cos\\theta,\\quad u_y=u\\sin\\theta"},{"text":"Vertical displacement is zero on landing, so 0 = u_y t − ½gt². The non-zero root is the time of flight:","tex":"t=\\frac{2u\\sin\\theta}{g}"},{"text":"Horizontal motion is uniform, so R = u_x t:","tex":"R=u\\cos\\theta\\cdot\\frac{2u\\sin\\theta}{g}"},{"text":"Use 2 sinθ cosθ = sin 2θ:","tex":"R=\\frac{u^2\\sin2\\theta}{g}"}],"misconceptions":["Thinking the horizontal velocity decreases during flight: with no air resistance it is constant.","Assuming a heavier projectile lands sooner: g is independent of mass."],"tips":["Treat horizontal and vertical motion separately; time is the link.","Maximum range is at 45° only for equal launch and landing heights."]}]}]},{"id":3,"title":"Dynamics","strand":"Mechanics","topics":[{"id":"newton","name":"Newton's laws and momentum","formulas":[{"id":"fma","name":"Newton's second law","tex":"F=ma","vars":[["F","resultant force","N"],["m","mass","kg"],["a","acceleration","m s⁻²"]],"conditions":"Constant mass; F is the resultant force; non-relativistic speeds.","steps":[{"text":"Newton's second law: resultant force equals rate of change of momentum, with p = mv:","tex":"F=\\frac{\\Delta p}{\\Delta t}=\\frac{\\Delta(mv)}{\\Delta t}"},{"text":"For constant mass, m can be taken outside the change:","tex":"F=m\\frac{\\Delta v}{\\Delta t}"},{"text":"Δv/Δt is acceleration:","tex":"F=ma"},{"text":"This also defines the newton: 1 N is the force giving a 1 kg mass an acceleration of 1 m s⁻²."}],"misconceptions":["Using one of several forces for F rather than the resultant.","Believing a force is needed to maintain constant velocity; zero resultant gives zero acceleration."],"tips":["Draw a free-body diagram and state the direction taken as positive.","Rocket or conveyor-belt problems with changing mass need F = Δp/Δt."]},{"id":"elastic","name":"Elastic collision: relative speed","tex":"u_1-u_2=v_2-v_1","vars":[["u_1,u_2","velocities before collision","m s⁻¹"],["v_1,v_2","velocities after collision","m s⁻¹"]],"conditions":"Perfectly elastic collision in one dimension (kinetic energy conserved).","steps":[{"text":"Momentum is conserved:","tex":"m_1u_1+m_2u_2=m_1v_1+m_2v_2"},{"text":"Kinetic energy is conserved:","tex":"\\tfrac12m_1u_1^2+\\tfrac12m_2u_2^2=\\tfrac12m_1v_1^2+\\tfrac12m_2v_2^2"},{"text":"Rearrange each so that the m₁ terms are on one side and the m₂ terms on the other:","tex":"m_1(u_1-v_1)=m_2(v_2-u_2),\\qquad m_1(u_1^2-v_1^2)=m_2(v_2^2-u_2^2)"},{"text":"Divide the energy equation by the momentum equation. Using a² − b² = (a − b)(a + b), the m and (u − v) factors cancel:","tex":"u_1+v_1=v_2+u_2"},{"text":"Rearrange: relative speed of approach equals relative speed of separation.","tex":"u_1-u_2=v_2-v_1"}],"misconceptions":["Applying it to inelastic collisions: there, separation speed is less than approach speed.","Thinking momentum is lost in an inelastic collision; only kinetic energy is."],"tips":["Test elasticity: compare relative speeds, or compare total kinetic energy before and after.","Momentum is a vector: sign matters in head-on collisions."]}]}]},{"id":4,"title":"Forces, Density and Pressure","strand":"Mechanics","topics":[{"id":"pressure","name":"Pressure in fluids and upthrust","formulas":[{"id":"rgh","name":"Hydrostatic pressure","tex":"p=\\rho g h","vars":[["p","pressure due to the liquid","Pa (N m⁻²)"],["\\rho","density","kg m⁻³"],["g","gravitational field strength","N kg⁻¹"],["h","depth below the surface","m"]],"conditions":"Fluid at rest, constant density, uniform g. Add atmospheric pressure for the total.","steps":[{"text":"Pressure is force per unit area:","tex":"p=\\frac{F}{A}"},{"text":"Consider a column of liquid of cross-section A and height h above the point. Its volume is V = Ah, so its mass is:","tex":"m=\\rho V=\\rho Ah"},{"text":"The force on the base is the column's weight:","tex":"F=mg=\\rho Ahg"},{"text":"Divide by A; the area cancels:","tex":"p=\\frac{\\rho Ahg}{A}=\\rho g h"}],"misconceptions":["Pressure depends on container shape or total volume: only depth, density and g matter.","Forgetting atmospheric pressure when the question asks for the total pressure."],"tips":["Pressure difference between two depths: Δp = ρgΔh.","Pressure at a given depth acts equally in all directions."]},{"id":"upthrust","name":"Upthrust (Archimedes' principle)","tex":"U=\\rho_f V_{disp}\\,g","vars":[["U","upthrust","N"],["\\rho_f","fluid density","kg m⁻³"],["V_{disp}","volume of fluid displaced","m³"],["g","gravitational field strength","N kg⁻¹"]],"conditions":"Object wholly or partly immersed in a fluid at rest.","steps":[{"text":"Take a cuboid of height h and area A fully submerged, its top face at depth h₁ and bottom at h₂ = h₁ + h."},{"text":"Forces from the fluid on the top (down) and bottom (up) faces:","tex":"F_{top}=\\rho g h_1A,\\qquad F_{bottom}=\\rho g h_2A"},{"text":"Side forces cancel by symmetry, so the net upward force is:","tex":"U=\\rho gA(h_2-h_1)=\\rho g Ah"},{"text":"Ah is the volume of the cuboid, equal to the volume of fluid displaced:","tex":"U=\\rho_f V_{disp}g=\\text{weight of fluid displaced}"}],"misconceptions":["Upthrust depends on the object's weight or density: only on the fluid displaced.","A floating object has upthrust greater than its weight: it equals the weight."],"tips":["Origin of upthrust: pressure increases with depth, so the lower face feels a larger force.","Floating: U = W, so ρ_f V_disp = ρ_object V_object."]}]},{"id":"moments","name":"Moments and equilibrium","formulas":[{"id":"couple","name":"Torque of a couple","tex":"\\tau = F\\,d","vars":[["\\tau","torque of the couple","N m"],["F","magnitude of one of the two forces","N"],["d","perpendicular distance between the lines of action","m"]],"conditions":"Two equal, antiparallel forces with different lines of action.","steps":[{"text":"A couple is two equal and opposite forces F whose lines of action are a distance d apart. The resultant force is zero."},{"text":"Take moments about any point P, at distance x from the nearer force's line. The two moments act in the same turning sense:","tex":"\\tau=F x+F(d-x)"},{"text":"x cancels, so the torque is independent of the pivot:","tex":"\\tau=Fd"}],"misconceptions":["A couple produces translation: its resultant force is zero, so only rotation.","Using the length of a spanner instead of the perpendicular distance between forces."],"tips":["In equilibrium: resultant force = 0 and the sum of clockwise moments = the sum of anticlockwise moments about any point.","Choose a pivot that eliminates the unknown force."]}]}]},{"id":5,"title":"Work, Energy and Power","strand":"Mechanics","topics":[{"id":"energy","name":"Work, kinetic and potential energy","formulas":[{"id":"work","name":"Work done by a force","tex":"W=Fs\\cos\\theta","vars":[["W","work done","J"],["F","force","N"],["s","displacement","m"],["\\theta","angle between F and s","°"]],"conditions":"Constant force; s is displacement along the line of motion.","steps":[{"text":"Work is the force component in the direction of motion multiplied by the displacement."},{"text":"Resolve F along s:","tex":"F_\\parallel=F\\cos\\theta"},{"text":"Multiply:","tex":"W=F_\\parallel s=Fs\\cos\\theta"},{"text":"At θ = 90° no work is done (e.g. centripetal force)."}],"misconceptions":["A force always does work: none if there is no displacement or the force is perpendicular to it.","Mixing up work and power."],"tips":["Area under a force–displacement graph is work done.","The joule: 1 J = 1 N m = 1 kg m² s⁻²."]},{"id":"ek","name":"Kinetic energy","tex":"E_k=\\tfrac12mv^2","vars":[["E_k","kinetic energy","J"],["m","mass","kg"],["v","speed","m s⁻¹"]],"conditions":"Non-relativistic speeds.","steps":[{"text":"Accelerate a mass m from rest to v over a distance s with constant force F. Work done:","tex":"W=Fs=mas"},{"text":"From v² = u² + 2as with u = 0, as = v²/2:","tex":"W=m\\cdot\\frac{v^2}{2}"},{"text":"By conservation of energy this work is stored as kinetic energy:","tex":"E_k=\\tfrac12mv^2"}],"misconceptions":["Doubling speed doubles kinetic energy: it quadruples it.","Kinetic energy is a vector: it is scalar and never negative."],"tips":["Link to momentum: E_k = p²/2m.","Use energy methods when the path or time is unknown."]},{"id":"gpe","name":"Change in gravitational potential energy","tex":"\\Delta E_p=mg\\Delta h","vars":[["m","mass","kg"],["g","gravitational field strength","N kg⁻¹"],["\\Delta h","change in height","m"]],"conditions":"Near the Earth's surface, where g is uniform.","steps":[{"text":"To raise an object at constant speed, the lifting force equals its weight:","tex":"F=mg"},{"text":"Work done against gravity through a vertical height Δh (force parallel to displacement):","tex":"W=F\\Delta h=mg\\Delta h"},{"text":"This work is stored as gravitational potential energy:","tex":"\\Delta E_p=mg\\Delta h"}],"misconceptions":["Path matters: only vertical height change counts.","Using the length along a slope instead of the vertical height."],"tips":["Falling: mgΔh = ½mv² − ½mu² when air resistance is negligible.","Energy lost to friction appears as thermal energy."]}]},{"id":"power","name":"Power","formulas":[{"id":"pfv","name":"Power and velocity","tex":"P=Fv","vars":[["P","power","W"],["F","driving force","N"],["v","constant velocity","m s⁻¹"]],"conditions":"Force parallel to the velocity; constant force over the interval considered.","steps":[{"text":"Power is the rate of doing work:","tex":"P=\\frac{W}{t}"},{"text":"For a force parallel to the motion, W = Fs:","tex":"P=\\frac{Fs}{t}"},{"text":"Distance divided by time is velocity:","tex":"P=F\\frac{s}{t}=Fv"}],"misconceptions":["Greater power means more energy: it means energy transferred faster.","A car at maximum speed has zero driving force: the driving force equals the drag."],"tips":["At top speed, F = drag, so P = Fv gives the drag-force power.","Efficiency = useful output ÷ total input, as a fraction or percentage."]}]}]},{"id":6,"title":"Deformation of Solids","strand":"Mechanics","topics":[{"id":"elastic-solids","name":"Hooke's law, strain energy, Young modulus","formulas":[{"id":"ee","name":"Elastic potential energy","tex":"E=\\tfrac12Fx=\\tfrac12kx^2","vars":[["E","elastic (strain) energy","J"],["F","force","N"],["x","extension","m"],["k","force constant","N m⁻¹"]],"conditions":"Within the limit of proportionality (Hooke's law region).","steps":[{"text":"Work done stretching = area under the force–extension graph. In the Hooke region F = kx, a straight line through the origin."},{"text":"The area is a triangle of base x and height F:","tex":"E=\\tfrac12Fx"},{"text":"Substitute F = kx:","tex":"E=\\tfrac12kx^2"}],"misconceptions":["Using E = Fx: that overestimates, since the force grows from zero.","Applying it beyond the limit of proportionality, where the graph is curved."],"tips":["For non-linear graphs count squares.","Area between loading and unloading curves is energy dissipated as heat."]},{"id":"ym","name":"Young modulus and force constant","tex":"E=\\frac{\\sigma}{\\varepsilon}=\\frac{FL}{Ax},\\quad k=\\frac{EA}{L}","vars":[["\\sigma=F/A","stress","Pa"],["\\varepsilon=x/L","strain","no unit"],["E","Young modulus","Pa"],["k","force constant","N m⁻¹"]],"conditions":"Wire or rod within the limit of proportionality; uniform cross-section.","steps":[{"text":"Stress is force per unit cross-sectional area and strain is extension per unit original length:","tex":"\\sigma=\\frac{F}{A},\\qquad \\varepsilon=\\frac{x}{L}"},{"text":"In the Hooke region stress ∝ strain; the constant is the Young modulus:","tex":"E=\\frac{\\sigma}{\\varepsilon}=\\frac{F/A}{x/L}=\\frac{FL}{Ax}"},{"text":"Rearrange for F and compare with F = kx:","tex":"F=\\frac{EA}{L}x\\;\\Rightarrow\\;k=\\frac{EA}{L}"}],"misconceptions":["Young modulus depends on the sample's size: it is a material property (stiffness depends on size via k).","Mixing area units: convert mm² to m² (×10⁻⁶)."],"tips":["Experiment: plot F against x, gradient = k = EA/L; measure d with a micrometer for A = πd²/4.","Uncertainty in diameter dominates since A ∝ d²."]}]}]},{"id":7,"title":"Waves","strand":"Waves","topics":[{"id":"wave-eq","name":"Wave speed, intensity and polarisation","formulas":[{"id":"vfl","name":"Wave equation","tex":"v=f\\lambda","vars":[["v","wave speed","m s⁻¹"],["f","frequency","Hz"],["\\lambda","wavelength","m"]],"conditions":"Any progressive wave in a uniform medium.","steps":[{"text":"In one period T the wave pattern advances exactly one wavelength λ:","tex":"v=\\frac{\\text{distance}}{\\text{time}}=\\frac{\\lambda}{T}"},{"text":"Frequency is the reciprocal of the period:","tex":"f=\\frac1T"},{"text":"Substitute:","tex":"v=f\\lambda"}],"misconceptions":["Frequency changes on refraction: it is set by the source; speed and wavelength change.","Wave speed is the particle speed: particles oscillate, only the pattern advances."],"tips":["On refraction f is constant, so v₁/λ₁ = v₂/λ₂.","Read λ from a displacement–distance graph and T from a displacement–time graph."]},{"id":"iA2","name":"Intensity and amplitude","tex":"I=\\frac{P}{A}\\propto a^2","vars":[["I","intensity","W m⁻²"],["P","power","W"],["A","area","m²"],["a","amplitude","m"]],"conditions":"Power received perpendicular to the area; point source: I ∝ 1/r².","steps":[{"text":"Intensity is power per unit area:","tex":"I=\\frac{P}{A}"},{"text":"A wave's energy is proportional to the square of its amplitude: oscillation energy E = ½mω²a²."},{"text":"Power is energy per unit time, so I ∝ a². For a point source spreading over a sphere:","tex":"I=\\frac{P}{4\\pi r^2}\\;\\Rightarrow\\;a\\propto\\frac1r"}],"misconceptions":["Doubling amplitude doubles intensity: it quadruples it.","Intensity falls as 1/r: it is 1/r² for a point source."],"tips":["Ratio questions: I₂/I₁ = (a₂/a₁)².","Write the intensity ratio before substituting numbers."]},{"id":"malus","name":"Malus's law","tex":"I=I_0\\cos^2\\theta","vars":[["I_0","intensity of plane-polarised light incident on analyser","W m⁻²"],["I","transmitted intensity","W m⁻²"],["\\theta","angle between polarisation direction and analyser axis","°"]],"conditions":"Plane-polarised light incident on an ideal polarising filter.","steps":[{"text":"Amplitude a₀ of the incident wave is resolved into components parallel and perpendicular to the analyser's axis."},{"text":"Only the parallel component passes:","tex":"a=a_0\\cos\\theta"},{"text":"Intensity ∝ amplitude², so:","tex":"I=I_0\\cos^2\\theta"}],"misconceptions":["Sound can be polarised: only transverse waves can.","Unpolarised light through one filter loses all intensity: it loses half."],"tips":["Crossed polarisers (θ = 90°) transmit nothing.","Rotating an analyser through 360° gives two maxima and two minima."]}]}]},{"id":8,"title":"Superposition","strand":"Waves","topics":[{"id":"interference","name":"Interference and diffraction","formulas":[{"id":"phase","name":"Phase difference and path difference","tex":"\\Delta\\phi=\\frac{2\\pi\\,\\Delta x}{\\lambda}","vars":[["\\Delta\\phi","phase difference","rad"],["\\Delta x","path difference","m"],["\\lambda","wavelength","m"]],"conditions":"Two coherent waves of the same wavelength.","steps":[{"text":"One wavelength of path difference corresponds to one full cycle, 2π rad."},{"text":"A path difference of Δx is the fraction Δx/λ of a cycle:","tex":"\\frac{\\Delta\\phi}{2\\pi}=\\frac{\\Delta x}{\\lambda}"},{"text":"Rearrange:","tex":"\\Delta\\phi=\\frac{2\\pi\\,\\Delta x}{\\lambda}"},{"text":"Constructive interference needs Δx = nλ, destructive Δx = (n + ½)λ."}],"misconceptions":["Destructive interference destroys energy: it is redistributed to the maxima.","Using a phase difference in degrees inside a radian formula."],"tips":["Coherence needs a constant phase difference and the same frequency.","At a minimum, Δx = (n + ½)λ."]},{"id":"dslit","name":"Double-slit interference","tex":"\\lambda=\\frac{ax}{D}","vars":[["\\lambda","wavelength","m"],["a","slit separation","m"],["x","fringe separation","m"],["D","slits-to-screen distance","m"]],"conditions":"Coherent slits; D ≫ a; small angles so sinθ ≈ tanθ ≈ θ.","steps":[{"text":"A bright fringe at angle θ has a path difference between the two slits:","tex":"\\Delta=a\\sin\\theta"},{"text":"For the nth bright fringe Δ = nλ. Adjacent fringes (n and n+1) differ by one wavelength in path difference:","tex":"a\\,\\Delta(\\sin\\theta)=\\lambda"},{"text":"For small angles, sinθ ≈ tanθ = y/D, so adjacent fringes separated by x give Δ(sinθ) = x/D:","tex":"a\\cdot\\frac{x}{D}=\\lambda"},{"text":"Rearrange:","tex":"\\lambda=\\frac{ax}{D}"}],"misconceptions":["Fringe separation increases with slit separation: it decreases.","Fringes are formed by a single source with one slit: two coherent sources are needed."],"tips":["Measure across several fringes and divide for x to reduce uncertainty.","Red light gives wider fringes than blue."]},{"id":"grating","name":"Diffraction grating","tex":"d\\sin\\theta=n\\lambda","vars":[["d","grating spacing (1/lines per metre)","m"],["\\theta","angle of nth order","°"],["n","order of maximum","integer"],["\\lambda","wavelength","m"]],"conditions":"Monochromatic light at normal incidence on a plane transmission grating.","steps":[{"text":"Light from adjacent slits, separation d, travels to a distant point at angle θ. The path difference is:","tex":"\\Delta=d\\sin\\theta"},{"text":"A maximum requires every pair of adjacent slits to be in phase, so the path difference is a whole number of wavelengths:","tex":"d\\sin\\theta=n\\lambda"},{"text":"The largest order satisfies sinθ ≤ 1, so n_max = ⌊d/λ⌋."}],"misconceptions":["Using the number of lines per mm as d without converting: d = 1/N.","Counting the central maximum as the first order: it is n = 0."],"tips":["Convert N lines per mm: d = 10⁻³/N metres.","Maximum orders: use sinθ = 1, and round the result down."]}]}]},{"id":9,"title":"Electricity","strand":"D.C. Circuits","topics":[{"id":"charge","name":"Charge, current, resistance","formulas":[{"id":"iq","name":"Current as rate of flow of charge","tex":"I=\\frac{\\Delta Q}{\\Delta t}","vars":[["I","current","A"],["Q","charge","C"],["t","time","s"]],"conditions":"Defined for any conductor; for charged particles of charge e, Q = Ne.","steps":[{"text":"Current is the rate of flow of charge past a point:","tex":"I=\\frac{\\Delta Q}{\\Delta t}"},{"text":"Charge is quantised: N electrons carry Q = Ne, with e = 1.60 × 10⁻¹⁹ C."},{"text":"Hence 1 ampere is 1 coulomb per second; the coulomb is a derived unit, 1 C = 1 A s."}],"misconceptions":["Current is used up in a component: charge is conserved, so current is the same through components in series.","Conventional current direction equals electron flow: it is opposite."],"tips":["Area under an I–t graph is charge transferred.","Ammeters in series, with very low resistance."]},{"id":"iAnvq","name":"Drift velocity equation","tex":"I=Anvq","vars":[["I","current","A"],["A","cross-sectional area","m²"],["n","charge carriers per unit volume","m⁻³"],["v","mean drift velocity","m s⁻¹"],["q","charge on each carrier","C"]],"conditions":"Uniform conductor with a single type of charge carrier.","steps":[{"text":"In time Δt every carrier within a length vΔt of a cross-section passes through it. The volume of that segment is:","tex":"V=Av\\Delta t"},{"text":"Number of carriers in it, with n per unit volume:","tex":"N=nAv\\Delta t"},{"text":"Total charge crossing in Δt:","tex":"\\Delta Q=nAv\\Delta t\\,q"},{"text":"Divide by Δt:","tex":"I=\\frac{\\Delta Q}{\\Delta t}=Anvq"}],"misconceptions":["Electrons move at the speed of light: drift velocity is of the order of mm s⁻¹; the field propagates quickly.","Thinner wire means smaller current at the same drift speed: a thinner wire has a larger drift speed for the same current."],"tips":["Metals have large n; semiconductors have small n so larger v for the same I.","Same I through different areas: v ∝ 1/A."]},{"id":"vwq","name":"Potential difference and EMF","tex":"V=\\frac{W}{Q}","vars":[["V","p.d. (or EMF E)","V"],["W","electrical energy transferred","J"],["Q","charge","C"]],"conditions":"p.d.: electrical to other forms; EMF: other forms to electrical.","steps":[{"text":"The p.d. across a component is the energy transferred from electrical to other forms per unit charge passing through it:","tex":"V=\\frac{W}{Q}"},{"text":"One volt is one joule per coulomb, 1 V = 1 J C⁻¹."},{"text":"EMF is the same quotient with W being the energy converted from chemical (or other) to electrical per unit charge, round the complete circuit."}],"misconceptions":["EMF is a force: it is energy per unit charge.","EMF and terminal p.d. are always equal: they are equal only when no current flows."],"tips":["Define p.d. and EMF in energy-per-charge terms.","Work done by a source: W = EQ = EIt."]},{"id":"res","name":"Resistance and resistivity","tex":"R=\\frac{V}{I},\\quad R=\\frac{\\rho L}{A}","vars":[["R","resistance","Ω"],["\\rho","resistivity","Ω m"],["L","length","m"],["A","cross-sectional area","m²"]],"conditions":"Ohm's law (V ∝ I) requires an ohmic conductor at constant temperature; R = V/I defines resistance always.","steps":[{"text":"Resistance is defined as p.d. per unit current:","tex":"R=\\frac{V}{I}"},{"text":"Experiment shows that for a uniform wire R ∝ L (more atoms to collide with in series) and R ∝ 1/A (more parallel paths)."},{"text":"Combine with a constant of proportionality ρ, which is a property of the material:","tex":"R=\\frac{\\rho L}{A}"}],"misconceptions":["Resistance changes with p.d.: for an ohmic conductor it does not; for a filament lamp it increases with temperature.","Halving the diameter doubles R: it quadruples it, since A ∝ d²."],"tips":["For the I–V curve of a filament lamp, R = V/I at each point (not the tangent gradient).","Thermistor (NTC): R decreases as temperature rises."]},{"id":"pvi","name":"Electrical power","tex":"P=VI=I^2R=\\frac{V^2}{R}","vars":[["P","power","W"],["V","p.d.","V"],["I","current","A"],["R","resistance","Ω"]],"conditions":"P = VI always; the other forms need V = IR (resistive component).","steps":[{"text":"Energy transferred is W = VQ, and Q = It:","tex":"W=VIt"},{"text":"Power is energy per unit time:","tex":"P=\\frac Wt=VI"},{"text":"Use V = IR to eliminate V or I:","tex":"P=I^2R,\\qquad P=\\frac{V^2}{R}"}],"misconceptions":["Higher resistance always means more power: depends on whether I or V is held constant.","Mains lamp 60 W has a fixed resistance: it varies with temperature."],"tips":["Transmission at high voltage: lower I means lower I²R loss.","kWh is an energy unit: 3.6 × 10⁶ J."]}]}]},{"id":10,"title":"D.C. Circuits","strand":"D.C. Circuits","topics":[{"id":"combos","name":"Resistor combinations and potential divider","formulas":[{"id":"series","name":"Resistors in series","tex":"R_{total}=R_1+R_2+\\cdots","vars":[["R_i","individual resistances","Ω"]],"conditions":"Components in a single path; same current through each.","steps":[{"text":"Same current I flows through each resistor (charge conservation)."},{"text":"The source EMF equals the sum of the p.d.s (energy conservation per coulomb):","tex":"V=V_1+V_2=IR_1+IR_2"},{"text":"Compare with V = IR_total:","tex":"R_{total}=R_1+R_2"}],"misconceptions":["Total resistance falls when adding series resistors: it rises."],"tips":["Series: current shared, p.d. split."]},{"id":"parallel","name":"Resistors in parallel","tex":"\\frac1{R_{total}}=\\frac1{R_1}+\\frac1{R_2}+\\cdots","vars":[["R_i","individual resistances","Ω"]],"conditions":"Branches connected across the same two points; same p.d. across each.","steps":[{"text":"The p.d. V across each branch is the same. Currents divide, and by Kirchhoff's first law:","tex":"I=I_1+I_2"},{"text":"Use I = V/R for each:","tex":"\\frac{V}{R_{total}}=\\frac V{R_1}+\\frac V{R_2}"},{"text":"Divide by V:","tex":"\\frac1{R_{total}}=\\frac1{R_1}+\\frac1{R_2}"}],"misconceptions":["Total parallel resistance exceeds the largest branch: it is smaller than the smallest."],"tips":["Two resistors: R = R₁R₂/(R₁ + R₂).","n identical resistors: R/n."]},{"id":"divider","name":"Potential divider","tex":"V_{out}=\\frac{R_2}{R_1+R_2}V_{in}","vars":[["V_{in}","supply p.d.","V"],["V_{out}","p.d. across R₂","V"],["R_1,R_2","series resistors","Ω"]],"conditions":"No current drawn by the load, or the load resistance is much larger than R₂.","steps":[{"text":"Series current through both resistors:","tex":"I=\\frac{V_{in}}{R_1+R_2}"},{"text":"The p.d. across R₂ is IR₂:","tex":"V_{out}=IR_2=\\frac{R_2}{R_1+R_2}V_{in}"}],"misconceptions":["Connecting a load changes nothing: the load in parallel with R₂ lowers V_out."],"tips":["Sensor circuits: replace R₂ with a thermistor or LDR."]},{"id":"kcl","name":"Kirchhoff's first law","tex":"\\sum I_{in}=\\sum I_{out}","vars":[["I_{in}","currents into a junction","A"],["I_{out}","currents out of a junction","A"]],"conditions":"Any junction in a steady d.c. circuit.","steps":[{"text":"Charge cannot accumulate at a junction in a steady state."},{"text":"Charge arriving per second equals charge leaving per second:","tex":"\\frac{\\Delta Q_{in}}{\\Delta t}=\\frac{\\Delta Q_{out}}{\\Delta t}"},{"text":"Therefore:","tex":"\\sum I_{in}=\\sum I_{out}"}],"misconceptions":["Current is lost when it passes a resistor: only energy is."],"tips":["State: conservation of charge. Use for branch current calculations."]},{"id":"kvl","name":"Kirchhoff's second law","tex":"\\sum E=\\sum IR","vars":[["E","EMFs around the loop (signed)","V"],["IR","p.d.s around the loop (signed)","V"]],"conditions":"Any closed loop of a circuit.","steps":[{"text":"Energy is conserved: a unit charge completing a loop gains energy from the EMFs and loses the same amount in the resistances."},{"text":"Therefore, around any closed loop:","tex":"\\sum E=\\sum IR"},{"text":"Sign convention: choose a loop direction; an EMF is positive if it drives current in that direction; IR is positive if I is in that direction."}],"misconceptions":["Sign errors from mixed conventions: fix direction first."],"tips":["State: conservation of energy. Write each loop, then use the first law to cut unknowns."]},{"id":"internal","name":"EMF and internal resistance","tex":"E=I(R+r),\\quad V=E-Ir","vars":[["E","EMF","V"],["r","internal resistance","Ω"],["R","external (load) resistance","Ω"],["V","terminal p.d.","V"]],"conditions":"A real source driving a steady current through an external load.","steps":[{"text":"Apply Kirchhoff's second law to the loop: the EMF equals the sum of the p.d.s across external and internal resistances.","tex":"E=IR+Ir"},{"text":"IR is the terminal p.d. V across the load:","tex":"E=V+Ir"},{"text":"Rearrange:","tex":"V=E-Ir"},{"text":"A plot of V against I is a straight line: intercept E, gradient −r. Lost volts Ir is energy per coulomb dissipated inside the cell."}],"misconceptions":["Terminal p.d. equals EMF under load: it is lower by Ir.","Short circuit current is infinite: it is E/r."],"tips":["Maximum power to the load when R = r.","Experiments: plot V against I, then E = y-intercept, r = −gradient."]}]}]}]

const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const tex=(t,b)=>{try{return katex.renderToString(t,{displayMode:!!b,throwOnError:false,strict:false})}catch(e){return t}};
const blk=(t)=>`<span class="disp">${tex(t,true)}</span>`;
const f=(x,d=2)=>Number.isFinite(x)?x.toFixed(d):'—';
const FLAT=UNITS.flatMap(u=>u.topics.flatMap(t=>t.formulas.map(x=>({...x,unit:u.id,unitTitle:u.title,topic:t.name}))));
const app=document.getElementById('app');

document.getElementById('nav').innerHTML=ROUTES.map(([h,l])=>`<a href="#${h}" data-r="${h}" class="rounded-lg px-3 py-1.5 text-slate-300 hover:bg-indigo-500/15 hover:text-indigo-200">${l}</a>`).join('');

 app.innerHTML=`<section class="py-10 text-center"><p class="text-sm uppercase tracking-widest text-indigo-400">Cambridge International AS Level</p><h1 class="mt-3 font-display text-4xl font-bold text-white sm:text-6xl">AS Physics Masterclass &amp; Lab</h1><p class="mx-auto mt-5 max-w-2xl text-slate-400">Mechanics, waves and D.C. circuits: understand where each equation comes from, know exactly when it applies, and test it on a live circuit.</p></section><div class="grid gap-5 md:grid-cols-3">${c.map(([h,t,d,x])=>`<a href="#${h}" class="card transition hover:border-indigo-500/60"><div class="rounded-lg bg-slate-950/60 p-4 text-center text-xl">${tex(x)}</div><h2 class="mt-4 font-display text-xl font-semibold text-white">${t}</h2><p class="mt-2 text-sm text-slate-400">${d}</p></a>`).join('')}</div>`}

function card(x){return `<article class="card space-y-4"><header class="flex flex-wrap items-start justify-between gap-3"><div><h4 class="font-display text-lg font-semibold text-white">${x.name}</h4><p class="mt-1 text-xs text-slate-400"><span class="font-medium text-indigo-300">Valid when:</span> ${x.conditions}</p></div><div class="rounded-lg bg-slate-950/70 px-4 py-2 text-xl">${tex(x.tex)}</div></header>
<dl class="grid gap-x-6 gap-y-1 text-sm sm:grid-cols-2">${x.vars.map(([s,m,u])=>`<div class="flex items-baseline gap-2"><dt class="min-w-12">${tex(s)}</dt><dd class="text-slate-300">${m} <span class="text-slate-500">[${u}]</span></dd></div>`).join('')}</dl>
<button data-tg class="rounded-lg border border-indigo-500/40 bg-indigo-500/10 px-4 py-2 text-sm font-medium text-indigo-200 hover:bg-indigo-500/20">Show step-by-step proof / derivation</button>
<ol class="hidden space-y-3 rounded-xl border border-slate-800 bg-slate-950/50 p-4">${x.steps.map((s,i)=>`<li class="flex gap-3"><span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-indigo-600 text-xs font-bold text-white">${i+1}</span><div class="min-w-0 text-sm"><p>${s.text}</p>${s.tex?blk(s.tex):''}</div></li>`).join('')}</ol>
<div class="grid gap-3 md:grid-cols-2"><div class="rounded-xl border border-rose-500/30 bg-rose-500/5 p-3 text-sm"><h5 class="mb-1 font-semibold text-rose-300">Common misconceptions</h5><ul class="list-disc space-y-1 pl-5 text-slate-300">${x.misconceptions.map(m=>`<li>${m}</li>`).join('')}</ul></div><div class="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-3 text-sm"><h5 class="mb-1 font-semibold text-emerald-300">Exam tips (Paper 1 &amp; 2)</h5><ul class="list-disc space-y-1 pl-5 text-slate-300">${x.tips.map(m=>`<li>${m}</li>`).join('')}</ul></div></div></article>`}

function archive(){let uid=+(sessionStorage.getItem?.('u')||2);
 app.innerHTML=`<div class="space-y-6"><div><h1 class="font-display text-3xl font-bold text-white">Formula Derivation &amp; Proof Archive</h1><p class="mt-2 text-slate-400">Pick a unit, then open any card to see how the equation is built from definitions and conservation laws.</p></div><div id="tabs" class="flex flex-wrap gap-2"></div><section id="body" class="space-y-6"></section></div>`;
 const draw=()=>{const u=UNITS.find(x=>x.id===uid);
  document.getElementById('tabs').innerHTML=UNITS.map(x=>`<button data-u="${x.id}" class="rounded-lg border px-3 py-2 text-sm ${x.id===uid?'border-indigo-400 bg-indigo-600 text-white':'border-slate-700 bg-slate-900 text-slate-300 hover:border-indigo-500/60'}"><b>Unit ${x.id}</b><span class="hidden lg:inline"> · ${x.title}</span></button>`).join('');
  document.getElementById('body').innerHTML=`<h2 class="font-display text-2xl text-indigo-300">Unit ${u.id}: ${u.title} <span class="ml-2 text-xs uppercase tracking-wider text-slate-500">${u.strand}</span></h2>`+u.topics.map(t=>`<div class="space-y-4"><h3 class="border-l-4 border-indigo-500 pl-3 text-lg font-semibold text-slate-100">${t.name}</h3>${t.formulas.map(card).join('')}</div>`).join('')};
 app.onclick=e=>{const b=e.target.closest('[data-u]');if(b){uid=+b.dataset.u;try{sessionStorage.setItem('u',uid)}catch(_){}draw();return}
  const g=e.target.closest('[data-tg]');if(g){const ol=g.nextElementSibling;const h=ol.classList.toggle('hidden');g.textContent=(h?'Show':'Hide')+' step-by-step proof / derivation'}};
 draw()}

function reference(){app.innerHTML=`<div class="space-y-5"><div><h1 class="font-display text-3xl font-bold text-white">Master AS Physics Equation Table</h1><p class="mt-2 text-slate-400">Search by name, symbol, quantity or condition; filter by unit.</p></div><div class="flex flex-col gap-3 sm:flex-row"><input id="q" placeholder="Search, e.g. “resistivity”, “elastic”, “constant acceleration”…" class="flex-1 rounded-lg border border-slate-700 bg-slate-900 px-4 py-2.5 text-sm outline-none focus:border-indigo-400"><select id="un" class="rounded-lg border border-slate-700 bg-slate-900 px-3 py-2.5 text-sm"><option value="0">All units</option>${UNITS.map(u=>`<option value="${u.id}">Unit ${u.id}: ${u.title}</option>`).join('')}</select></div><p id="cnt" class="text-xs text-slate-500"></p><div class="overflow-x-auto rounded-2xl border border-slate-800"><table class="w-full min-w-[860px] text-left text-sm"><thead class="bg-slate-900 text-xs uppercase tracking-wider text-indigo-300"><tr><th class="px-4 py-3">Topic / Unit</th><th class="px-4 py-3">Equation</th><th class="px-4 py-3">Variables &amp; SI units</th><th class="px-4 py-3">Conditions of validity</th></tr></thead><tbody id="rows" class="divide-y divide-slate-800"></tbody></table></div></div>`;
 const q=document.getElementById('q'),un=document.getElementById('un');
 const draw=()=>{const s=q.value.trim().toLowerCase(),u=+un.value;const rows=FLAT.filter(r=>(!u||r.unit===u)&&(!s||[r.name,r.topic,r.unitTitle,r.conditions,r.tex,...r.vars.flat()].join(' ').toLowerCase().includes(s)));
  document.getElementById('cnt').textContent=`${rows.length} of ${FLAT.length} equations`;
  document.getElementById('rows').innerHTML=rows.map(r=>`<tr class="align-top hover:bg-slate-900/60"><td class="px-4 py-3"><div class="font-medium text-slate-100">${r.topic}</div><div class="text-xs text-slate-500">Unit ${r.unit}: ${r.unitTitle}</div></td><td class="px-4 py-3"><div class="mb-1 text-slate-300">${r.name}</div><div class="text-base">${tex(r.tex)}</div></td><td class="px-4 py-3"><ul class="space-y-0.5">${r.vars.map(([a,m,n])=>`<li>${tex(a)} <span class="text-slate-300">– ${m}</span> <span class="text-slate-500">[${n}]</span></li>`).join('')}</ul></td><td class="px-4 py-3 text-slate-300">${r.conditions}</td></tr>`).join('')||'<tr><td colspan="4" class="px-4 py-10 text-center text-slate-500">No equations match your search.</td></tr>'};
 q.oninput=draw;un.onchange=draw;draw()}

const slider=(id,label,sym,min,max,step,val,unit)=>`<label class="block text-sm"><div class="mb-1 flex justify-between"><span class="text-slate-300">${label} ${tex(sym)}</span><span id="${id}v" class="font-mono text-indigo-300"></span></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></label>`;
function loopPoint(t,x0=60,y0=40,w=380,h=170){const p=2*(w+h),d=(((t%1)+1)%1)*p;if(d<w)return[x0+d,y0];if(d<w+h)return[x0+w,y0+d-w];if(d<2*w+h)return[x0+w-(d-w-h),y0+h];return[x0,y0+h-(d-2*w-h)]}
function graph(E,r,I,V){const W=440,H=300,m={l:50,r:20,t:20,b:40},iM=E/r,xM=Math.max(iM,.1);const sx=i=>m.l+i/xM*(W-m.l-m.r),sy=v=>H-m.b-v/(E*1.1)*(H-m.t-m.b);
 const ticks=[0,.25,.5,.75,1].map(k=>`<line x1="${sx(k*xM)}" y1="${H-m.b}" x2="${sx(k*xM)}" y2="${H-m.b+4}" stroke="#64748b"/><text x="${sx(k*xM)}" y="${H-m.b+16}" fill="#94a3b8" font-size="10" text-anchor="middle">${f(k*xM,1)}</text><line x1="${m.l-4}" y1="${sy(k*E)}" x2="${m.l}" y2="${sy(k*E)}" stroke="#64748b"/><text x="${m.l-8}" y="${sy(k*E)+3}" fill="#94a3b8" font-size="10" text-anchor="end">${f(k*E,1)}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" class="w-full"><line x1="${m.l}" y1="${H-m.b}" x2="${W-m.r}" y2="${H-m.b}" stroke="#64748b"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H-m.b}" stroke="#64748b"/>${ticks}<line x1="${sx(0)}" y1="${sy(E)}" x2="${sx(iM)}" y2="${sy(0)}" stroke="#818cf8" stroke-width="2.5"/><line x1="${sx(I)}" y1="${sy(V)}" x2="${sx(I)}" y2="${sy(0)}" stroke="#38bdf8" stroke-dasharray="4"/><line x1="${m.l}" y1="${sy(V)}" x2="${sx(I)}" y2="${sy(V)}" stroke="#38bdf8" stroke-dasharray="4"/><circle cx="${sx(I)}" cy="${sy(V)}" r="6" fill="#f59e0b"/><circle cx="${sx(0)}" cy="${sy(E)}" r="4" fill="#34d399"/><text x="${m.l+8}" y="${sy(E)-8}" fill="#34d399" font-size="11">y-intercept = E = ${f(E,1)} V</text><text x="${sx(iM/2)+8}" y="${sy(E/2)-10}" fill="#c7d2fe" font-size="11">gradient = −r = −${f(r)} Ω</text><text x="${sx(iM)}" y="${sy(0)-8}" fill="#fda4af" font-size="10" text-anchor="end">short-circuit I = E/r = ${f(iM)} A</text><text x="${(W+m.l)/2}" y="${H-6}" fill="#cbd5e1" font-size="12" text-anchor="middle">Current I / A</text><text transform="translate(12 ${H/2}) rotate(-90)" fill="#cbd5e1" font-size="12" text-anchor="middle">Terminal p.d. V / V</text></svg>`}
function diagram(E,r,R,I,V){return `<svg viewBox="0 0 500 250" class="w-full"><rect x="60" y="40" width="380" height="170" rx="6" fill="none" stroke="#475569" stroke-width="3"/><rect x="40" y="95" width="40" height="60" fill="#0f172a"/><line x1="48" y1="108" x2="72" y2="108" stroke="#e2e8f0" stroke-width="3"/><line x1="54" y1="122" x2="66" y2="122" stroke="#e2e8f0" stroke-width="6"/><text x="88" y="118" fill="#a5b4fc" font-size="13">E = ${f(E,1)} V</text><rect x="45" y="158" width="30" height="20" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><text x="88" y="173" fill="#fbbf24" font-size="12">r = ${f(r)} Ω</text><rect x="415" y="95" width="50" height="60" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="395" y="130" fill="#7dd3fc" font-size="13" text-anchor="end">R = ${f(R,1)} Ω</text><text x="250" y="30" fill="#cbd5e1" font-size="13" text-anchor="middle">I = ${f(I)} A · terminal p.d. V = ${f(V)} V</text><g id="dots" fill="#818cf8">${Array.from({length:28},()=>'<circle r="3.2"/>').join('')}</g><text x="250" y="238" fill="#64748b" font-size="11" text-anchor="middle">Electrons (drift opposite to conventional current); speed ∝ I</text></svg>`}

function lab(){
 app.innerHTML=`<div class="space-y-6"><div><h1 class="font-display text-3xl font-bold text-white">Interactive Electrical Circuits Laboratory</h1><p class="mt-2 text-slate-400">Units 9 &amp; 10: vary the EMF, internal resistance and load, and watch every quantity update.</p></div>
 <div class="grid gap-6 lg:grid-cols-2"><div class="card space-y-4"><div class="grid gap-4 sm:grid-cols-3 lg:grid-cols-1 xl:grid-cols-3">${slider('E','EMF','E',1,24,.5,9,'V')}${slider('r','Internal resistance','r',.1,10,.1,1.5,'Ω')}${slider('R','Load','R',.5,50,.5,6,'Ω')}</div><div id="dg"></div><dl id="ro" class="grid grid-cols-2 gap-2 text-sm sm:grid-cols-4"></dl><div id="eq"></div><p id="pw" class="text-xs text-slate-400"></p></div>
 <div class="card space-y-3"><h2 class="font-display text-lg text-white">V against I: ${tex('V=E-Ir')}</h2><div id="gr"></div><p class="text-sm text-slate-400">The straight line has y-intercept ${tex('E')} and gradient ${tex('-r')}. The orange point is the operating point set by the load slider.</p></div></div>
 <div class="grid gap-6 lg:grid-cols-2"><div class="card space-y-3" id="k1"></div><div class="card space-y-3" id="k2"></div></div></div>`;
 const g=id=>document.getElementById(id);let speed=0,ph=0,last=0,id,I=0;
 const upd=()=>{const E=+g('E').value,r=+g('r').value,R=+g('R').value;I=E/(R+r);const V=E-I*r,Pl=I*I*R,Pi=I*I*r;
  [['E',1],['r',2],['R',1]].forEach(([k,d])=>{const e=g(k);g(k+'v').textContent=f(+e.value,d)+' '+e.dataset.unit});
  g('dg').innerHTML=diagram(E,r,R,I,V);speed=Math.min(I,12)*.035;
  g('ro').innerHTML=[['Current I',f(I)+' A'],['Terminal V',f(V)+' V'],['Lost volts Ir',f(I*r)+' V'],['Load power',f(Pl)+' W']].map(([k,v])=>`<div class="rounded-lg bg-slate-950/60 p-2"><dt class="text-xs text-slate-500">${k}</dt><dd class="font-mono text-indigo-200">${v}</dd></div>`).join('');
  g('eq').innerHTML=blk(`I=\\frac{E}{R+r}=\\frac{${f(E,1)}}{${f(R,1)}+${f(r,1)}}=${f(I)}\\ \\text{A},\\quad V=E-Ir=${f(V)}\\ \\text{V}`);
  g('pw').textContent=`Power: source E·I = ${f(E*I)} W = load ${f(Pl)} W + internal ${f(Pi)} W. Load power is greatest when R = r (try it).`;
  g('gr').innerHTML=graph(E,r,I,V)};
 ['E','r','R'].forEach(k=>g(k).oninput=upd);upd();
 const tick=now=>{const dt=last?(now-last)/1000:0;last=now;ph=(ph-speed*dt+1000)%1;const c=document.querySelectorAll('#dots circle');c.forEach((el,i)=>{const[x,y]=loopPoint(ph+i/c.length);el.setAttribute('cx',x);el.setAttribute('cy',y);el.setAttribute('opacity',I<.005?.15:.95)});id=requestAnimationFrame(tick)};
 id=requestAnimationFrame(tick);stop=()=>cancelAnimationFrame(id);

 /* Kirchhoff 1 */
 let ins=[3,1.5],outs=[2,0];
 const k1=()=>{const sI=ins.reduce((a,b)=>a+b,0),sO=outs.reduce((a,b)=>a+b,0),d=sI-sO,ok=Math.abs(d)<1e-9;
  const row=(a,p)=>a.map((v,i)=>`<label class="flex items-center gap-2 text-sm"><span class="w-14">${tex(`I_{${p}${i+1}}`)}</span><input type="number" min="0" step="0.1" value="${v}" data-p="${p}" data-i="${i}" class="w-24 rounded border border-slate-700 bg-slate-950 px-2 py-1"> A</label>`).join('');
  g('k1').innerHTML=`<h3 class="font-display text-lg text-white">Kirchhoff's first law: junction calculator</h3><div class="grid gap-4 sm:grid-cols-2"><div class="space-y-2"><p class="text-xs uppercase text-emerald-400">Currents in</p>${row(ins,'in')}<button data-add="in" class="text-xs text-indigo-300">+ add branch in</button></div><div class="space-y-2"><p class="text-xs uppercase text-rose-400">Currents out</p>${row(outs,'out')}<button data-add="out" class="text-xs text-indigo-300">+ add branch out</button></div></div>${blk(`\\sum I_{in}=${f(sI)}\\ \\text{A},\\qquad \\sum I_{out}=${f(sO)}\\ \\text{A}`)}<p class="rounded-lg p-3 text-sm ${ok?'bg-emerald-500/10 text-emerald-300':'bg-amber-500/10 text-amber-200'}">${ok?'Balanced: charge is conserved at this junction.':d>0?`Unbalanced: an extra outgoing current of ${f(d)} A is needed to conserve charge.`:`Unbalanced: an extra incoming current of ${f(-d)} A is needed.`}</p>`};
 g('k1').onchange=e=>{const t=e.target;if(t.dataset.p){(t.dataset.p==='in'?ins:outs)[+t.dataset.i]=Math.max(0,+t.value||0);k1()}};
 g('k1').onclick=e=>{const a=e.target.dataset.add;if(a){(a==='in'?ins:outs).push(0);k1()}};k1();

 /* Kirchhoff 2 */
 const v={E1:12,E2:5,R1:4,R2:2,R3:1};
 const sl=(k,l,s,max,st,u)=>slider('k'+k,l,s,k[0]==='E'?0:1,max,st,v[k],u);
 g('k2').innerHTML=`<h3 class="font-display text-lg text-white">Kirchhoff's second law: loop solver</h3><p class="text-xs text-slate-400">A single loop with two opposing batteries (internal resistances included in R₁–R₃). The E₁ direction is taken as positive.</p><div class="grid gap-3 sm:grid-cols-2">${sl('E1','EMF','E_1',24,.5,'V')}${sl('E2','EMF (opposing)','E_2',24,.5,'V')}${sl('R1','Resistance','R_1',20,1,'Ω')}${sl('R2','Resistance','R_2',20,1,'Ω')}${sl('R3','Resistance','R_3',20,1,'Ω')}</div><div id="k2o" class="space-y-3"></div>`;
 const k2=()=>{Object.keys(v).forEach(k=>{v[k]=+g('k'+k).value;g('k'+k+'v').textContent=f(v[k],k[0]==='E'?1:0)+' '+g('k'+k).dataset.unit});
  const Rt=v.R1+v.R2+v.R3,Il=(v.E1-v.E2)/Rt,s=Il*Rt;
  g('k2o').innerHTML=blk(`E_1-E_2=I(R_1+R_2+R_3)\\;\\Rightarrow\\; I=\\frac{${f(v.E1,1)}-${f(v.E2,1)}}{${Rt}}=${f(Il)}\\ \\text{A}`)+`<ul class="grid gap-1 text-sm sm:grid-cols-3">${[1,2,3].map(i=>`<li class="rounded bg-slate-950/60 px-3 py-1.5">V<sub>${i}</sub>: <span class="font-mono text-sky-300">${f(Il*v['R'+i])} V</span></li>`).join('')}</ul><p class="rounded-lg bg-indigo-500/10 p-3 text-sm text-indigo-200">Check: ΣE = ${f(v.E1-v.E2)} V and ΣIR = ${f(s)} V, so they agree. ${Il<0?'Negative I means current flows opposite to the assumed direction (E₂ dominates).':''}</p>`};
 Object.keys(v).forEach(k=>g('k'+k).oninput=k2);k2()}
route();
</script></body></html>
